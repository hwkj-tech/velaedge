schema_version = 1

# This file only controls process startup. Protocol connections, point sets,
# collection/command graphs and MQTT sinks are synchronized from Cloud and
# persisted in the Runtime RocksDB database.
[runtime]
edge_id = "edge-dev"
device_id = "pump-1"
runtime_id = "runtime-dev"
storage_path = "../data/telemetry.jsonl"
database_path = "../data/edge-runtime.rocksdb"
health_listen = "127.0.0.1:19090"

[cloud]
gateway_address = "127.0.0.1:18080"
daemon = true
command_wait_ms = 30000
reconnect_ms = 1000

# For local plaintext EdgeLink, leave all three certificate paths unset.
# Production mTLS requires ca_cert, client_cert and client_key together.
[cloud.tls]
server_name = "localhost"
# ca_cert = "../certs/ca.pem"
# client_cert = "../certs/edge-dev.pem"
# client_key = "../certs/edge-dev.key"

[features]
mqtt_uplink = true
allow_simulated = false

# scheduled_ticks is only for the legacy one-shot HTTP compatibility mode.
[scheduler]
scheduled_ticks = 0
tick_ms = 1000
