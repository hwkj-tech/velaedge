[package]
name = "velaedge-protocol-device-sim"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "protocol-device-sim"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bacnet-client = "0.10.1"
bacnet-encoding = "0.10.1"
bacnet-network = "0.10.1"
bacnet-services = "0.10.1"
bacnet-transport = "0.10.1"
bacnet-types = "0.10.1"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
snap7-server = "0.1.7"
tokio = { version = "1.38", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
voltage_iec104 = "0.1.0"

[workspace]
